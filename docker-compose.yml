name: autohealops
services:
  frontend:
    build: ./frontend
    ports:
    - 127.0.0.1:3000:3000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
  backend:
    build: ./backend
    ports:
    - 127.0.0.1:8000:8000
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/autohealops
      AI_URL: http://ai-engine:8001
      PROMETHEUS_URL: http://prometheus:9090
    depends_on:
      mongo:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    volumes:
    - backend-data:/app/data
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
  ai-engine:
    build: ./ai-engine
    ports:
    - 127.0.0.1:8001:8001
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
  mongo:
    image: mongo:7.0.16
    volumes:
    - mongo-data:/data/db
    healthcheck:
      test:
      - CMD
      - mongosh
      - --quiet
      - --eval
      - db.adminCommand('ping').ok
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.2.1
    profiles:
    - monitoring
    ports:
    - 127.0.0.1:9090:9090
    volumes:
    - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus-data:/prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.retention.time=7d
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://localhost:9090/-/ready
      interval: 15s
      retries: 5
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.6.0
    profiles:
    - monitoring
    ports:
    - 127.0.0.1:3001:3000
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
    - grafana-data:/var/lib/grafana
    - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./monitoring/grafana/dashboard.json:/var/lib/grafana/dashboards/autohealops.json:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://localhost:3000/api/health
      interval: 15s
      retries: 5
    restart: unless-stopped
    entrypoint:
    - /bin/sh
    - -ec
    - test -n "$$GF_SECURITY_ADMIN_PASSWORD" || { echo "GRAFANA_ADMIN_PASSWORD is
      required; run setup.ps1"; exit 1; }; exec /run.sh
volumes:
  backend-data: null
  mongo-data: null
  prometheus-data: null
  grafana-data: null
