# Prometheus Configuration for AutoHealOps
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true

  - job_name: 'autohealops-backend'
    static_configs:
      - targets: ['backend:8000']

  - job_name: 'autohealops-ai-engine'
    static_configs:
      - targets: ['ai-engine:8001']

  - job_name: 'kubernetes-nodes'
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.*)

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
