global:
  scrape_interval: 15s
scrape_configs:
  - job_name: autohealops
    metrics_path: /telemetry
    static_configs:
      - targets: ['backend:8000']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
# Kubernetes resource metrics require kube-state-metrics and kubelet/cAdvisor.
# Configure these in a cluster Prometheus; Docker Compose does not invent them.
