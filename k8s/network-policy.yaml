apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: autohealops-ingress
  namespace: autohealops
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
  - ports:
    - protocol: TCP
      port: 3000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: autohealops-frontend
  namespace: autohealops
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: autohealops-frontend
