apiVersion: apps/v1
kind: Deployment
metadata:
  name: autohealops-backend
  namespace: autohealops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app: autohealops-backend
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 10001
        fsGroup: 10001
      containers:
      - name: backend
        image: autohealops-backend:2.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /health/live
            port: 8000
          failureThreshold: 30
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
        envFrom:
        - configMapRef:
            name: autohealops-config
        volumeMounts:
        - name: data
          mountPath: /app/data
      serviceAccountName: autohealops-sa
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: autohealops-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autohealops-ai-engine
  namespace: autohealops
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: &id001
      app: autohealops-ai-engine
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 10001
      containers:
      - name: ai-engine
        image: autohealops-ai-engine:2.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
        resources:
          requests:
            cpu: 250m
            memory: 384Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /health/live
            port: 8001
          failureThreshold: 30
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8001
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health/live
            port: 8001
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autohealops-frontend
  namespace: autohealops
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: &id001
      app: autohealops-frontend
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: frontend
        image: autohealops-frontend:2.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /health
            port: 3000
          failureThreshold: 30
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 5
