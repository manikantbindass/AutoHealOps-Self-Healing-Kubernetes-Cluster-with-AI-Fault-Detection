apiVersion: v1
kind: ServiceAccount
metadata:
  name: autohealops-sa
  namespace: autohealops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: autohealops-role
  namespace: autohealops
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - patch
- apiGroups:
  - apps
  resources:
  - deployments/scale
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: autohealops-binding
  namespace: autohealops
subjects:
- kind: ServiceAccount
  name: autohealops-sa
  namespace: autohealops
roleRef:
  kind: Role
  name: autohealops-role
  apiGroup: rbac.authorization.k8s.io
