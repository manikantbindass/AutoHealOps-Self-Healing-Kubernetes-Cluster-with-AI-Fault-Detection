apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: autohealops
spec:
  selector:
    app: autohealops-backend
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: ai-engine
  namespace: autohealops
spec:
  selector:
    app: autohealops-ai-engine
  ports:
  - port: 8001
    targetPort: 8001
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: autohealops
spec:
  selector:
    app: autohealops-frontend
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
